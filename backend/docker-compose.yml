services:
  db:
    image: postgres:16
    container_name: reservas_db
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5432:5432"
    volumes:
      - reservas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reservas_pgdata:
